services: 

  backend:
    build: "./backend"
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - "./backend:/app"
    command: "pnpm dev"
    environment: 
      JWT_SECRET: ${JWT_SECRET}
      MONGO_URI: ${MONGO_URI}
      PORT: ${PORT:-3000}

  mongodb:
    image: "mongo:8"
    volumes:
    - "mongodb_data:/data/db"

volumes:
  mongodb_data:
